<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t6 d6">
  <title id="t6">Form Label and Input Structure</title>
  <desc id="d6">A simple contact form showing each label connected by a line to its matching input field, with a submit button below.</desc>
  <rect width="720" height="380" fill="#0a0a0a"/>

  <rect x="40" y="30" width="640" height="320" rx="12" fill="#141414" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Field 1 -->
  <text x="70" y="80" fill="#e5e5e5" font-family="sans-serif" font-size="15">Full Name</text>
  <rect x="220" y="60" width="440" height="34" rx="6" fill="#0a0a0a" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="145" y1="76" x2="215" y2="76" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="70" fill="#d4af37" font-family="sans-serif" font-size="11">for="name"</text>

  <!-- Field 2 -->
  <text x="70" y="150" fill="#e5e5e5" font-family="sans-serif" font-size="15">Email</text>
  <rect x="220" y="130" width="440" height="34" rx="6" fill="#0a0a0a" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="110" y1="146" x2="215" y2="146" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="115" y="140" fill="#d4af37" font-family="sans-serif" font-size="11">for="email"</text>

  <!-- Field 3 -->
  <text x="70" y="220" fill="#e5e5e5" font-family="sans-serif" font-size="15">Message</text>
  <rect x="220" y="200" width="440" height="70" rx="6" fill="#0a0a0a" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="145" y1="216" x2="215" y2="216" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="210" fill="#d4af37" font-family="sans-serif" font-size="11">for="message"</text>

  <!-- Submit button -->
  <rect x="220" y="295" width="140" height="40" rx="6" fill="#d4af37"/>
  <text x="290" y="320" text-anchor="middle" fill="#0a0a0a" font-family="sans-serif" font-size="14" font-weight="700">Send</text>
</svg>
