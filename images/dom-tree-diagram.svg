<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">HTML Document Object Model Tree</title>
  <desc id="d1">A tree diagram: html at the top, branching into head and body. Head contains title. Body contains h1, p, and ul, with ul branching into three li items.</desc>
  <rect width="1000" height="460" fill="#0a0a0a"/>

  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="450" y1="70" x2="270" y2="150"/>
    <line x1="450" y1="70" x2="630" y2="150"/>
    <line x1="270" y1="180" x2="270" y2="230"/>
    <line x1="630" y1="180" x2="450" y2="240"/>
    <line x1="630" y1="180" x2="630" y2="240"/>
    <line x1="630" y1="180" x2="790" y2="240"/>
    <line x1="790" y1="270" x2="670" y2="350"/>
    <line x1="790" y1="270" x2="790" y2="350"/>
    <line x1="790" y1="270" x2="910" y2="350"/>
  </g>

  <!-- html -->
  <g>
    <rect x="395" y="35" width="110" height="42" rx="6" fill="#1e1e1e" stroke="#d4af37" stroke-width="2"/>
    <text x="450" y="61" text-anchor="middle" fill="#f5f5f5" font-family="monospace" font-size="16">&lt;html&gt;</text>
  </g>

  <!-- head -->
  <g>
    <rect x="215" y="150" width="110" height="42" rx="6" fill="#1e1e1e" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="270" y="176" text-anchor="middle" fill="#f5f5f5" font-family="monospace" font-size="15">&lt;head&gt;</text>
  </g>

  <!-- body -->
  <g>
    <rect x="575" y="150" width="110" height="42" rx="6" fill="#1e1e1e" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="630" y="176" text-anchor="middle" fill="#f5f5f5" font-family="monospace" font-size="15">&lt;body&gt;</text>
  </g>

  <!-- title -->
  <g>
    <rect x="215" y="230" width="110" height="38" rx="6" fill="#141414" stroke="#9ca3af" stroke-width="1"/>
    <text x="270" y="254" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="13">&lt;title&gt;</text>
  </g>

  <!-- h1 -->
  <g>
    <rect x="400" y="240" width="100" height="38" rx="6" fill="#141414" stroke="#9ca3af" stroke-width="1"/>
    <text x="450" y="264" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="13">&lt;h1&gt;</text>
  </g>

  <!-- p -->
  <g>
    <rect x="580" y="240" width="100" height="38" rx="6" fill="#141414" stroke="#9ca3af" stroke-width="1"/>
    <text x="630" y="264" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="13">&lt;p&gt;</text>
  </g>

  <!-- ul -->
  <g>
    <rect x="740" y="240" width="100" height="38" rx="6" fill="#141414" stroke="#9ca3af" stroke-width="1"/>
    <text x="790" y="264" text-anchor="middle" fill="#d4d4d4" font-family="monospace" font-size="13">&lt;ul&gt;</text>
  </g>

  <!-- li x3 -->
  <g>
    <rect x="625" y="350" width="90" height="34" rx="6" fill="#0f0f0f" stroke="#6b7280" stroke-width="1"/>
    <text x="670" y="372" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12">&lt;li&gt;</text>

    <rect x="745" y="350" width="90" height="34" rx="6" fill="#0f0f0f" stroke="#6b7280" stroke-width="1"/>
    <text x="790" y="372" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12">&lt;li&gt;</text>

    <rect x="865" y="350" width="90" height="34" rx="6" fill="#0f0f0f" stroke="#6b7280" stroke-width="1"/>
    <text x="910" y="372" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12">&lt;li&gt;</text>
  </g>
</svg>
